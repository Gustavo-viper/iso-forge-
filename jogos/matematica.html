<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desafio da Matemática</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .tempo { font-weight: 800; color: var(--muted); }
    .tempo.pouco { color: var(--bad); }
  </style>
</head>
<body>
  <header class="topo">
    <a href="../index.html">← Jogos</a>
    <h1>➗ Desafio da Matemática</h1>
    <span class="placar" id="placar"></span>
  </header>
  <main>
    <section class="cartao centro" id="menu">
      <h2>Escolha a operação</h2>
      <div class="linha-botoes" id="ops">
        <button class="btn secundario ativo" data-op="+">Soma +</button>
        <button class="btn secundario" data-op="-">Subtração −</button>
        <button class="btn secundario" data-op="x">Multiplicação ×</button>
        <button class="btn secundario" data-op="/">Divisão ÷</button>
        <button class="btn secundario" data-op="?">Misturado 🎲</button>
      </div>
      <h2>Nível</h2>
      <div class="linha-botoes" id="niveis">
        <button class="btn secundario ativo" data-nivel="1">Fácil</button>
        <button class="btn secundario" data-nivel="2">Médio</button>
        <button class="btn secundario" data-nivel="3">Difícil</button>
      </div>
      <p class="muted">10 perguntas · 15 segundos para cada uma</p>
      <button class="btn" id="comecar">Começar!</button>
    </section>

    <section class="cartao centro oculto" id="jogo">
      <div class="barra"><div id="progresso"></div></div>
      <div class="tempo" id="tempo"></div>
      <div class="pergunta" id="pergunta"></div>
      <div class="opcoes" id="opcoes"></div>
      <div class="mensagem" id="mensagem"></div>
    </section>

    <section class="cartao oculto" id="fim"></section>
  </main>

  <script src="../js/comum.js"></script>
  <script>
    const { aleatorio, embaralhar, som, mostrarResultado } = Jogos;
    const TOTAL = 10, SEGUNDOS = 15;
    let op = "+", nivel = 1, indice = 0, acertos = 0, cronometro = null, restante = 0;

    const $ = id => document.getElementById(id);

    function selecionar(grupo, atributo, aoEscolher) {
      grupo.addEventListener("click", e => {
        const b = e.target.closest("button");
        if (!b) return;
        grupo.querySelectorAll("button").forEach(x => x.classList.toggle("ativo", x === b));
        aoEscolher(b.dataset[atributo]);
      });
    }
    selecionar($("ops"), "op", v => op = v);
    selecionar($("niveis"), "nivel", v => nivel = Number(v));

    // Gera uma conta com resultado inteiro e não negativo.
    function gerarConta() {
      const o = op === "?" ? "+-x/"[aleatorio(0, 3)] : op;
      const max = [0, 10, 50, 100][nivel];
      const maxTab = [0, 5, 10, 12][nivel];
      let a, b, r, simbolo;
      if (o === "+") { a = aleatorio(0, max); b = aleatorio(0, max); r = a + b; simbolo = "+"; }
      else if (o === "-") { a = aleatorio(0, max); b = aleatorio(0, a); r = a - b; simbolo = "−"; }
      else if (o === "x") { a = aleatorio(1, maxTab); b = aleatorio(1, maxTab); r = a * b; simbolo = "×"; }
      else { b = aleatorio(1, maxTab); r = aleatorio(1, maxTab); a = b * r; simbolo = "÷"; }
      return { texto: `${a} ${simbolo} ${b} = ?`, resposta: r };
    }

    function alternativas(certa) {
      const set = new Set([certa]);
      const variacao = Math.max(3, Math.round(certa * 0.3));
      while (set.size < 4) {
        const v = certa + aleatorio(-variacao, variacao);
        if (v >= 0) set.add(v);
      }
      return embaralhar([...set]);
    }

    function comecar() {
      indice = 0; acertos = 0;
      $("menu").classList.add("oculto");
      $("fim").classList.add("oculto");
      $("jogo").classList.remove("oculto");
      proxima();
    }

    function proxima() {
      if (indice >= TOTAL) return terminar();
      const conta = gerarConta();
      $("progresso").style.width = `${(indice / TOTAL) * 100}%`;
      $("placar").textContent = `Acertos: ${acertos}`;
      $("pergunta").textContent = conta.texto;
      $("mensagem").textContent = "";
      $("mensagem").className = "mensagem";
      const box = $("opcoes");
      box.innerHTML = "";
      alternativas(conta.resposta).forEach(v => {
        const b = document.createElement("button");
        b.className = "opcao";
        b.textContent = v;
        b.addEventListener("click", () => responder(b, v === conta.resposta, conta.resposta));
        box.appendChild(b);
      });
      restante = SEGUNDOS;
      mostrarTempo();
      clearInterval(cronometro);
      cronometro = setInterval(() => {
        restante--;
        mostrarTempo();
        if (restante <= 0) responder(null, false, conta.resposta);
      }, 1000);
    }

    function mostrarTempo() {
      $("tempo").textContent = `⏱️ ${restante}s`;
      $("tempo").classList.toggle("pouco", restante <= 5);
    }

    function responder(botao, certo, resposta) {
      clearInterval(cronometro);
      const botoes = $("opcoes").querySelectorAll("button");
      botoes.forEach(b => {
        b.disabled = true;
        if (Number(b.textContent) === resposta) b.classList.add("certa");
      });
      const msg = $("mensagem");
      if (certo) {
        acertos++;
        som.acerto();
        msg.textContent = "Isso aí! 🎉";
        msg.classList.add("ok");
      } else {
        if (botao) botao.classList.add("errada");
        som.erro();
        msg.textContent = botao ? `Quase! A resposta é ${resposta}.` : `Tempo esgotado! A resposta é ${resposta}.`;
        msg.classList.add("erro");
      }
      $("placar").textContent = `Acertos: ${acertos}`;
      indice++;
      setTimeout(proxima, certo ? 900 : 1800);
    }

    function terminar() {
      $("jogo").classList.add("oculto");
      const fim = $("fim");
      fim.classList.remove("oculto");
      mostrarResultado(fim, {
        jogo: "matematica", acertos, total: TOTAL,
        aoReiniciar: () => { fim.classList.add("oculto"); $("menu").classList.remove("oculto"); },
      });
    }

    $("comecar").addEventListener("click", comecar);
  </script>
</body>
</html>
